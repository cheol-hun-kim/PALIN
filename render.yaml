services:
  - type: web
    name: palin-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: palin-db
          property: connectionString

databases:
  - name: palin-db
    plan: free
